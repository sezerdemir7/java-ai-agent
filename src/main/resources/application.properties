server.port=8080
spring.config.import=optional:file:.env[.properties]

# Google Gemini Konfigürasyonu
gemini.api-key=${GEMINI_API_KEY:}
gemini.model-name=gemini-2.5-flash

# Groq Konfigürasyonu (Llama-3 modelleri için)
groq.api-key=${GROQ_API_KEY:}
groq.model-name=llama-3.3-70b-versatile
groq.base-url=https://api.groq.com/openai/v1

# OpenAI Konfigürasyonu (Opsiyonel - İleride anahtar eklendiğinde devreye girer)
openai.api-key=${OPENAI_API_KEY:}
openai.model-name=gpt-4o-mini
openai.base-url=https://api.openai.com/v1

# Veritabanı Yapılandırması (H2 In-Memory RDBMS)
spring.datasource.url=jdbc:h2:mem:agentusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Konsolu (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
